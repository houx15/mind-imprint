<style>
  .sheet { background:#FBF8F4; border-radius:12px; padding:26px 22px; margin-bottom:18px; text-align:center; }

  .carrot { position:absolute; right:82px; bottom:16px; width:22px; height:38px; z-index:1; transform:rotate(-8deg); }

  /* hole on the ground: back rim (dirt) → dark → front lip (occludes 豆豆) */
  .hole-rim  { position:absolute; right:18px; bottom:12px; width:64px; height:24px; background:radial-gradient(ellipse at 50% 35%, #E4C79E, #CBA877); border-radius:50%; z-index:1; }

  @keyframes hop {

    90%  { transform:translate(165px,9px) scale(.55) rotate(320deg); opacity:1; }
    100% { transform:translate(167px,17px) scale(.24) rotate(340deg); opacity:0; }
  }
</style>
