<h2>印记 · 豆豆 · 四态</h2>
<p class="subtitle">身形锁定豆豆。下面是四态活起来的样子：思考=看上方+眨眼+脉冲圈 · 生成=眼睛随光标左右 · 处理=外圈转+具体动作 · 完成=眯眼笑+轻弹。表情克制，不夸张。accent 朱砂红（跟随学生 accent）。</p>

<style>
  .base { display:flex; align-items:center; gap:22px; background:#FBF8F4; border-radius:12px; padding:18px 20px; margin-bottom:18px; }
  .chatctx { display:flex; align-items:center; gap:9px; }
  .bub { background:#fff; border-radius:5px 12px 12px 12px; padding:8px 12px; font-size:13px; color:#4a3f3d; box-shadow:0 1px 3px rgba(70,45,45,.07); }

  .states { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:720px){ .states{grid-template-columns:1fr;} }
  .st { background:#fff; border:1px solid #EFE7DD; border-radius:12px; padding:18px 20px; display:flex; align-items:center; gap:16px; }
  .st .txt { font-size:13.5px; color:#5a5049; line-height:1.5; }
  .st .txt b { color:#33302E; display:block; font-size:14px; margin-bottom:2px; }
  .pb { width:56px; height:56px; flex:none; }
  .pb28 { width:28px; height:28px; }

  .eye, .eyes { transform-box:fill-box; transform-origin:center; }
  @keyframes blink { 0%,90%,100%{transform:scaleY(1)} 95%{transform:scaleY(.12)} }
  @keyframes dart  { 0%,100%{transform:translateX(-1.3px)} 50%{transform:translateX(1.3px)} }
  @keyframes pulse { 0%{transform:scale(.82);opacity:.5} 100%{transform:scale(1.32);opacity:0} }
  @keyframes spin  { to{transform:rotate(360deg)} }
  @keyframes pop   { 0%,100%{transform:scale(1)} 14%{transform:scale(1.09)} 30%{transform:scale(.99)} 44%{transform:scale(1)} }

  .think .eye { animation:blink 3s infinite; }
  .think .ring { transform-box:fill-box; transform-origin:center; animation:pulse 1.8s ease-out infinite; }
  .gen .eyes { animation:dart 1.4s ease-in-out infinite; }
  .proc .ring2 { transform-box:view-box; transform-origin:20px 20px; animation:spin .9s linear infinite; }
  .done { animation:pop 2.4s ease-in-out infinite; }
  .caret { display:inline-block; width:2px; height:14px; background:#EA5140; vertical-align:-2px; animation:blinkc .9s steps(1) infinite; }
  @keyframes blinkc { 50%{opacity:0} }
  .spin-lbl { display:flex; align-items:center; gap:8px; }
  .done-lbl { color:#3E6B45; font-weight:600; }
</style>

    <div class="txt"><b>思考中</b>看向上方、眨眼，外圈脉冲。“印记在想…”</div>

  <!-- generating -->

    <svg class="pb" viewBox="0 0 40 40">
      <path d="M20 6 C 30 5 36.5 11 35.5 21 C 34.5 30 27 35.5 18.5 34.5 C 9.5 33.5 4.5 27 5.5 18 C 6.5 10 12 7 20 6 Z" fill="#EA5140"/>

        <ellipse cx="16" cy="21" rx="1.9" ry="2.5" fill="#2A2724"/><circle cx="15.4" cy="20" r=".75" fill="#fff"/>
        <ellipse cx="25" cy="20.4" rx="1.9" ry="2.5" fill="#2A2724"/><circle cx="24.4" cy="19.4" r=".75" fill="#fff"/>
      </g>
    </svg>
    <div class="txt"><b>生成中</b>眼睛随光标左右移动。<br>它可信在哪一点<span class="caret"></span></div>
  </div>

  <!-- processing -->
  <div class="st proc">
    <svg class="pb" viewBox="0 0 40 40">
      <path d="M20 6 C 30 5 36.5 11 35.5 21 C 34.5 30 27 35.5 18.5 34.5 C 9.5 33.5 4.5 27 5.5 18 C 6.5 10 12 7 20 6 Z" fill="#EA5140"/>
      <ellipse cx="16" cy="21" rx="1.9" ry="2.5" fill="#2A2724"/>
      <ellipse cx="25" cy="20.4" rx="1.9" ry="2.5" fill="#2A2724"/>

    <div class="txt"><b>完成</b><span class="done-lbl">✓ 已找到 3 篇相关文献</span></div>
  </div>
</div>

<p class="subtitle" style="margin-top:16px;">👉 豆豆四态就是这样。表情/节奏想调（更慢、眼睛更大/更小、要不要加小嘴、完成要不要那颗小星）尽管说。确认后 AI 头像这块就完成了——我们可以开始<strong>实现设计</strong>了。</p>
