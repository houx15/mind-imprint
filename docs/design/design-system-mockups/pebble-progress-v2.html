<h2>进度条 · 豆豆骑在条<u>上方</u>滚（PvZ 那种）</h2>
<p class="subtitle">对味了——豆豆<strong>站在进度条上方</strong>，随着 accent 色条一起往前滚，像植物大战僵尸加载条上那株草。豆豆的底刚好压在条的顶边。</p>

<style>
  .sheet { background:#FBF8F4; border-radius:12px; padding:24px 22px; margin-bottom:18px; }
  .sheet h3 { margin:0 0 20px; font-size:15px; color:#33302E; }

  .pvz { position:relative; height:52px; }
  .rail { position:absolute; left:0; right:0; bottom:0; height:12px; background:#FBE0DC; border-radius:99px; }
  .fill { position:absolute; left:0; bottom:0; height:12px; background:#EA5140; border-radius:99px; width:2%; animation:fill 3.6s ease-out infinite; }
  .rider{ position:absolute; bottom:9px; left:-4px; width:32px; height:32px; animation:ride 3.6s ease-out infinite; }
  .rider .shadow { position:absolute; left:5px; right:5px; bottom:-2px; height:5px; background:rgba(150,40,30,.18); border-radius:50%; filter:blur(1px); }
  @keyframes fill {
    0%{ width:2%; opacity:1; } 88%{ width:96%; } 96%{ width:100%; opacity:1; } 100%{ width:100%; opacity:0; }
  }
  @keyframes ride {
    0%   { left:-4px; transform:rotate(0deg); opacity:1; }
    88%  { left:calc(96% - 28px); transform:rotate(600deg); }
    96%  { left:calc(100% - 30px); transform:rotate(660deg); opacity:1; }
    100% { left:calc(100% - 30px); transform:rotate(660deg); opacity:0; }
  }
  .note { font-size:12.5px; color:#8A827A; margin-top:14px; line-height:1.6; }

  /* smaller / slim */
  .pvz.slim { height:40px; }
  .pvz.slim .rail, .pvz.slim .fill { height:8px; }
  .pvz.slim .rider { width:24px; height:24px; bottom:6px; }
</style>

<div class="sheet">
  <h3>房间加载 / 长任务</h3>
  <div class="pvz">
    <div class="rail"></div>
    <div class="fill"></div>
    <div class="rider">
      <div class="shadow"></div>
      <svg viewBox="0 0 40 40" style="width:100%;height:100%;position:relative;">
        <path d="M20 6 C 30 5 36.5 11 35.5 21 C 34.5 30 27 35.5 18.5 34.5 C 9.5 33.5 4.5 27 5.5 18 C 6.5 10 12 7 20 6 Z" fill="#EA5140"/>
        <ellipse cx="16" cy="21" rx="2" ry="2.6" fill="#2A2724"/><circle cx="15.4" cy="20" r=".8" fill="#fff"/>
        <ellipse cx="25" cy="20.4" rx="2" ry="2.6" fill="#2A2724"/><circle cx="24.4" cy="19.4" r=".8" fill="#fff"/>
      </svg>
    </div>
  </div>
  <div class="note">豆豆的底压在条的顶边，位置 = 填充头部，滚着往前推。填满→淡出→重来。已知进度时豆豆停在对应位置。</div>
</div>

<div class="sheet">
  <h3>纤细版（页面顶）</h3>
  <div class="pvz slim">
    <div class="rail"></div>
    <div class="fill"></div>
    <div class="rider">
      <div class="shadow"></div>
      <svg viewBox="0 0 40 40" style="width:100%;height:100%;position:relative;">
        <path d="M20 6 C 30 5 36.5 11 35.5 21 C 34.5 30 27 35.5 18.5 34.5 C 9.5 33.5 4.5 27 5.5 18 C 6.5 10 12 7 20 6 Z" fill="#EA5140"/>
        <ellipse cx="16" cy="21" rx="2.1" ry="2.7" fill="#2A2724"/>
        <ellipse cx="25" cy="20.4" rx="2.1" ry="2.7" fill="#2A2724"/>
      </svg>
    </div>
  </div>
</div>

<p class="subtitle" style="margin-top:14px;">👉 这次对了吗？豆豆在条上方滚。速度、豆豆大小、要不要那点小阴影都能调。确认后 AI 头像＋进度加载全齐，<strong>就可以实现设计了</strong>。</p>
