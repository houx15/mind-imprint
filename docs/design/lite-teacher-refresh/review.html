<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lite 教师端 · 界面预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#233844;font-family:"Avenir Next","PingFang SC",sans-serif}header{padding:24px 32px;background:#fff;border-bottom:1px solid #dde5e8}h1{font-size:23px;margin:0 0 8px}p{font-size:13px;color:#627782;margin:0}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}button{padding:9px 13px;border:1px solid #dae3e5;border-radius:9px;background:white;color:#36545f;cursor:pointer}button[aria-pressed=true]{background:#087f8b;color:#fff;border-color:#087f8b}main{padding:22px;max-width:1500px;margin:auto}img{display:block;width:100%;height:auto;border:1px solid #dfe7e9;border-radius:12px}h2{font-size:16px;margin:0 0 14px}
</style>
<header><h1>Lite 教师端 · 教学工作室</h1><p>最新调整：班级活跃环图、学习完成条形图、可筛选的活跃天数分布与学生学习进度。截图使用模拟数据。</p><nav></nav></header>
<main><h2 id="label">班级首页</h2><img id="preview" src="classes.png" alt="班级首页截图"></main>
<script>
const pages=[['student-reading-visual','学生阅读报告'],['student-writing-visual','学生写作报告'],['student-project-visual','学生项目进度'],['reading-visual-export','阅读分享图片'],['writing-visual-export','写作分享图片'],['classes','班级首页'],['class','班级名单'],['student','学生档案'],['reading','阅读报告'],['writing','写作报告'],['project','项目成果'],['reading-details','阅读记录'],['writing-details','写作记录'],['project-details','项目记录'],['student-tree','兴趣树'],['settings','设置'],['classes-dark','深色主题'],['student-1280','笔记本布局'],['classes-empty','暂无班级'],['class-empty','暂无学生'],['student-empty','暂无学习记录']];
for(const [file,label] of pages){const button=document.createElement('button');button.textContent=label;button.setAttribute('aria-pressed',String(file==='classes'));button.onclick=()=>{document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.getElementById('preview').src=file+'.png';document.getElementById('preview').alt=label+'截图';document.getElementById('label').textContent=label};document.querySelector('nav').append(button)}
</script></html>
