                  - paragraph [ref=e469]: Methodology and applications of city level CO2 emission accounts in China
                  - paragraph [ref=e470]: Yuli Shan, Dabo Guan, Jianghua Liu, Jianghua Liu, Zhifu Mi, Zhu Liu, Jingru Liu, Jingru Liu, Heike Schroeder, Bofeng Cai, Yang Chen, Shuai Shao, Qiang Zhang · 2017 · Journal of Cleaner Production
                  - paragraph [ref=e471]: China is the world's largest energy consumer and CO2 emitter. Cities contribute 85% of the total CO2 emissions in China and thus are considered as the key areas for implementing policies designed for climate change adaption and CO2 emission mitigation. However, the emission inventory construction of Chinese cities has not been well researched, mainly owing to the lack of systematic statistics and poor data quality. Focusing on this research gap, we developed a set of methods for constructing CO2 emissions inventories for Chinese cities based on energy balance table. The newly constructed emission inventory is compiled in terms of the definition provided by the IPCC territorial emission accounting approach and covers 47 socioeconomic sectors, 17 fossil fuels and 9 primary industry products, which is corresponding with the national and provincial inventory. In the study, we applied the methods to compile CO2 emissions inventories for 24 common Chinese cities and examined uncertainties of the inventories. Understanding the emissions sources in Chinese cities is the basis for many climate policy and goal research in the future.
