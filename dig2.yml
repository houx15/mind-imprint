                  - paragraph [ref=e483]: CO2 hydrogenation to high-value products via heterogeneous catalysis
                  - paragraph [ref=e484]: Runping Ye, Jie Ding, Weibo Gong, Morris D. Argyle, Qin Zhong, Yujun Wang, Christopher K. Russell, Zhenghe Xu, Armistead G. Russell, Qiaohong Li, Maohong Fan, Yuan‐Gen Yao · 2019 · Nature Communications
                  - paragraph [ref=e485]: "Recently, carbon dioxide capture and conversion, along with hydrogen from renewable resources, provide an alternative approach to synthesis of useful fuels and chemicals. People are increasingly interested in developing innovative carbon dioxide hydrogenation catalysts, and the pace of progress in this area is accelerating. Accordingly, this perspective presents current state of the art and outlook in synthesis of light olefins, dimethyl ether, liquid fuels, and alcohols through two leading hydrogenation mechanisms: methanol reaction and Fischer-Tropsch based carbon dioxide hydrogenation. The future research directions for developing new heterogeneous catalysts with transformational technologies, including 3D printing and artificial intelligence, are provided."
