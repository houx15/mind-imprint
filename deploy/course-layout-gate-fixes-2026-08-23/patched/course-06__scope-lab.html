<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>事实范围实验室</title>
  <style>
:root{--ink:#17212b;--muted:#526170;--line:#cbd5df;--paper:#f5f7f9;--panel:#fff;--blue:#225e7c;--green:#277052;--amber:#9a6413;--red:#a93631;--focus:#d8edf5}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-size:16px}
body{display:grid;place-items:center;padding:8px;overflow-x:hidden;background:#eaf0f3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font-size:16px;font-family:inherit}
button,input,select,textarea{border:1px solid #9facb8;border-radius:6px;background:#fff;color:var(--ink)}
button{min-height:40px;padding:8px 14px;font-weight:700;cursor:pointer}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.secondary{background:#fff;color:var(--blue);border-color:var(--blue)}
button:disabled,input:disabled,select:disabled,textarea:disabled{opacity:.48;cursor:not-allowed}
.canvas{width:min(100%,1024px);aspect-ratio:4/3;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 14px 34px rgba(23,33,43,.14)}
header{padding:14px 18px 11px;border-bottom:1px solid var(--line)}
h1{margin:0 0 5px;font-size:24px;line-height:1.2;letter-spacing:0}
h2{margin:0 0 8px;font-size:19px;line-height:1.3;letter-spacing:0}
h3{margin:0 0 6px;font-size:17px;line-height:1.3;letter-spacing:0}
p{margin:0;line-height:1.5}
.sub{color:var(--muted)}
main{min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.stack{display:grid;gap:10px;align-content:start}
.card{border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:11px}
.evidence{background:#eef5f7;border-left:4px solid var(--blue)}
.feedback{min-height:44px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:9px 11px;color:var(--muted);line-height:1.45}
.feedback.ok{border-color:#7ab395;color:var(--green);background:#f1f8f4}
.feedback.bad{border-color:#d49a96;color:var(--red);background:#fff5f4}
.field{display:grid;gap:5px;color:var(--muted);font-weight:650}
input,select,textarea{width:100%;padding:8px 9px;line-height:1.4}
textarea{resize:vertical;min-height:74px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.check{display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-weight:500}
.check input{width:auto;margin:3px 0 0}
.visual{width:100%;max-height:200px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px}
.portrait{max-height:270px}
.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#dcebf1;color:var(--blue);font-weight:700}
.auxiliary{font-size:14px;color:var(--muted);line-height:1.4}
.meter{height:7px;background:#dce3e8;border-radius:5px;overflow:hidden}
.meter>span{display:block;height:100%;width:0;background:var(--green);transition:width .2s ease}
footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line);background:#fff}
.footer-status{color:var(--muted);line-height:1.35}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button[aria-selected="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.panel[hidden]{display:none}
.option-list{display:grid;gap:7px}
.option{display:flex;align-items:flex-start;gap:8px;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff}
.option input{width:auto;margin:3px 0 0}
details{border:1px solid var(--line);border-radius:7px;background:#fff;padding:8px 10px}
summary{font-weight:700;cursor:pointer}
@media(max-width:720px){.grid2{grid-template-columns:1fr}.canvas{aspect-ratio:4/3}h1{font-size:21px}.checks{grid-template-columns:1fr}}
</style>
</head>

  <script>
const PROTOCOL = "mind-course-interaction";
const VERSION = "1.0";
let sessionToken = null;
const pendingFrameMessages = [];
let completionSent = false;
let interactionEnabled = true;

function postFrameMessage(type, payload) {
  window.parent.postMessage({ protocol: PROTOCOL, version: VERSION, sessionToken, type, payload }, "*");
}

function send(type, payload) {
  if (!sessionToken) {
    pendingFrameMessages.push({ type, payload });
    return;
  }
  postFrameMessage(type, payload);
}

function syncControls() {
  document.querySelectorAll("button, input, select, textarea").forEach(control => {
    if (control.dataset.completion === "true") return;
    control.disabled = !interactionEnabled;
  });
  if (typeof syncCompletion === "function") syncCompletion();
}

window.addEventListener("message", event => {
  const message = event.data;
  if (!message || message.protocol !== PROTOCOL || message.version !== VERSION || !message.sessionToken) return;
  const isNewSession = sessionToken !== message.sessionToken;
  sessionToken = message.sessionToken;
  if (isNewSession) {
    postFrameMessage("ready", {});
    while (pendingFrameMessages.length) {
      const pending = pendingFrameMessages.shift();
      postFrameMessage(pending.type, pending.payload);
    }
  }
  if (["activate", "enable", "resumeMedia"].includes(message.type)) interactionEnabled = true;
  if (["deactivate", "disable", "pauseMedia", "stopMedia"].includes(message.type)) interactionEnabled = false;
  syncControls();
});


const fields = [document.getElementById("percentage"), document.getElementById("only"), document.getElementById("cannot")];
const checks = [...document.querySelectorAll(".check input")];
const complete = document.getElementById("complete");
function state() {
  return { percentage: fields[0].value, only: fields[1].value.trim(), cannot: fields[2].value.trim(), rangeClues: checks.filter(item => item.checked).map(item => item.value) };
}
function valid() { const value = state(); return value.percentage && value.only.length >= 12 && value.cannot.length >= 12 && value.rangeClues.length >= 2; }
function syncCompletion() {
  const value = state();
  complete.disabled = !interactionEnabled || completionSent || !valid();
  document.getElementById("status").textContent = `范围线索 ${Math.min(2, value.rangeClues.length)} / 2`;
  const feedback = document.getElementById("feedback");
  if (valid()) { feedback.textContent = "范围完整。提交前再检查：你写的是样本结果，不是全体人口结论。"; feedback.className = "feedback ok"; }
}
[...fields, ...checks].forEach(control => control.addEventListener("input", () => { syncCompletion(); send("progress", { value: state() }); }));
complete.addEventListener("click", () => {
  if (!valid() || completionSent) return;
  completionSent = true;
  send("completed", { resultId: "scope-range-v1", value: state() });
  complete.textContent = "已完成";
  syncCompletion();
});
syncCompletion();
</script>
