<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>完整让步段写作台</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; overflow-x: hidden; font-size: 16px; background: #eef3f1; color: #14212b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { display: grid; place-items: center; padding: 10px; }
.canvas { width: min(96vw, 820px); aspect-ratio: 1 / 1; display: flex; flex-direction: column; overflow: hidden; background: #fbfdfc; border: 1px solid #c8d4d0; border-radius: 8px; box-shadow: 0 12px 30px rgba(21, 38, 46, .16); }
.header { padding: 14px 16px 10px; background: #fff; border-bottom: 1px solid #d8e0dd; }
h1 { margin: 0; font-size: 22px; line-height: 1.25; }
.subtitle { margin: 5px 0 0; color: #526269; font-size: 16px; line-height: 1.4; }
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.55fr .9fr; gap: 12px; padding: 12px 14px; }
.panel { min-height: 0; border: 1px solid #d5dfdb; border-radius: 8px; background: #fff; padding: 12px; }
.writer { display: flex; flex-direction: column; gap: 8px; }
label, button, textarea, input { font-size: 16px; }
.field-label, .panel-title { margin: 0; color: #1f5e78; font-weight: 700; line-height: 1.35; }
textarea { flex: 1; min-height: 250px; width: 100%; resize: none; border: 1px solid #b7c4c0; border-radius: 7px; padding: 10px; line-height: 1.55; color: #14212b; background: #fbfcfd; }
textarea:focus { outline: 2px solid #4d8f78; outline-offset: 1px; }
.counter { margin: 0; color: #526269; font-size: 16px; }
.checklist { display: flex; flex-direction: column; gap: 10px; }
.checklist label { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; line-height: 1.45; padding: 9px; border: 1px solid #d5dfdb; border-radius: 7px; background: #f8fbfa; }
.checklist input { width: 18px; height: 18px; margin-top: 2px; }
.tip { margin: 2px 0 0; color: #526269; font-size: 16px; line-height: 1.4; }
.footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; background: #fff; border-top: 1px solid #d8e0dd; }
.note { color: #526269; font-size: 16px; line-height: 1.4; }
button { border: 1px solid #1f6b52; border-radius: 7px; padding: 9px 14px; background: #1f6b52; color: #fff; font-weight: 700; cursor: pointer; }
button:disabled { opacity: .45; cursor: not-allowed; }
@media (max-width: 720px) {
  body { padding: 4px; }
  .canvas { width: 100vw; }
  .main { grid-template-columns: 1fr; overflow-y: auto; }
  textarea { min-height: 220px; }
}
</style>
</head>
<body>
<div class="canvas">
  <header class="header">
    <h1>完整让步段写作台</h1>
    <p class="subtitle">写出一段会改变论点边界的让步段，再用四步清单自查。</p>
  </header>
  <main class="main">
    <section class="panel writer">
      <label class="field-label" for="draft">题目：学校该不该全面禁止学生带手机进校？</label>
      <textarea id="draft" placeholder="建议按“承认强点—修正原话—限定边界—回到主张”的顺序写，至少 80 字。"></textarea>
      <p class="counter" id="counter">已写 0 字；还需至少 80 字。</p>
    </section>
    <section class="panel checklist">
      <p class="panel-title">提交前自查</p>
      <label><input type="checkbox" data-check="acknowledge"> <span>我承认了反方最有力的证据。</span></label>
      <label><input type="checkbox" data-check="revise"> <span>我说明了原来的说法怎样被修正。</span></label>
      <label><input type="checkbox" data-check="boundary"> <span>我区分了“限制使用”和“清出校园”。</span></label>
      <label><input type="checkbox" data-check="claim"> <span>我回到了清楚、可辩护的最终主张。</span></label>
      <p class="tip">勾选表示你已经在正文中找到对应句子；如果找不到，请先补写。</p>
    </section>
  </main>
  <footer class="footer">
    <div class="note" id="note">完成不少于 80 字的段落，并勾选四项自查。</div>
    <button id="complete" type="button" disabled>完成任务</button>
  </footer>
</div>
<script>
const startedAt = Date.now();
const PROTOCOL = "mind-course-interaction";
const VERSION = "1.0";
// Legacy audit marker only: INTERACTION_COMPLETE is not emitted by this delivery copy.
let sessionToken = null;
const pendingFrameMessages = [];
let completionSent = false;

function durationSeconds() {
  return Math.max(1, Math.round((Date.now() - startedAt) / 1000));
}
function postFrameMessage(type, payload) {
  window.parent.postMessage({ protocol: PROTOCOL, version: VERSION, sessionToken, type, payload }, "*");
}
function send(type, payload) {
  if (!sessionToken) {
    pendingFrameMessages.push({ type, payload });
    return;
  }
  postFrameMessage(type, payload);
}
window.addEventListener("message", (event) => {
  const message = event.data;
  if (!message || message.protocol !== PROTOCOL || message.version !== VERSION || !message.sessionToken) return;
  const isNewSession = sessionToken !== message.sessionToken;
  sessionToken = message.sessionToken;
  if (!isNewSession) return;
  postFrameMessage("ready", {});
  while (pendingFrameMessages.length) {
    const pending = pendingFrameMessages.shift();
    postFrameMessage(pending.type, pending.payload);
  }
});

const draft = document.getElementById("draft");
const checks = [...document.querySelectorAll("[data-check]")];
const complete = document.getElementById("complete");

function currentText() {
  return draft.value.trim();
}
function update() {
  const count = currentText().length;
  const checkedCount = checks.filter(item => item.checked).length;
  document.getElementById("counter").textContent = count >= 80
    ? `已写 ${count} 字，长度达标。`
    : `已写 ${count} 字；还需至少 ${80 - count} 字。`;
  complete.disabled = completionSent || count < 80 || checkedCount < checks.length;
  document.getElementById("note").textContent = count < 80
    ? "先把段落写到至少 80 字。"
    : checkedCount < checks.length
      ? `再完成 ${checks.length - checkedCount} 项自查。`
      : "段落和四项自查都已完成，可以提交。";
}
draft.addEventListener("input", update);
checks.forEach(item => item.addEventListener("change", update));
complete.addEventListener("click", () => {
  if (complete.disabled || completionSent) return;
  completionSent = true;
  const answer = currentText();
  const checklist = Object.fromEntries(checks.map(item => [item.dataset.check, item.checked]));
  const interactions = [
    { interactionId: "paragraph-draft", type: "writing", answer },
    ...checks.map(item => ({ interactionId: `self-check-${item.dataset.check}`, type: "self-check", answer: item.checked }))
  ];
  send("completed", {
    resultId: "concession-paragraph-draft-1",
    value: { lessonId: "concession-paragraph-writer", duration: durationSeconds(), answer, characterCount: answer.length, checklist, interactions }
  });
  draft.disabled = true;
  checks.forEach(item => { item.disabled = true; });
  complete.disabled = true;
  document.getElementById("note").textContent = "已完成，段落和自查结果已记录。";
});
update();
</script>

html, body { height: 100%; min-height: 0; }
body { display: block !important; place-items: stretch !important; overflow: auto; }

  width: 100% !important;
  height: 100% !important;
  min-height: 0 !important;
  max-height: none !important;
  aspect-ratio: auto !important;
  margin: 0 !important;
  overflow: auto !important;
}
</style>
<!-- /mind-imprint:layout-fix-2026-08-23 -->
</body>
</html>
