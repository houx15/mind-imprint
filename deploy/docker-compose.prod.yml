# Production stack for 思维印记 (Mind Imprint).
#
# Run from the repo root:
#   docker compose --env-file deploy/.env.prod -f deploy/docker-compose.prod.yml up -d --build
#
# Topology (see docs/deploy/README.md):
#   host nginx (TLS, certbot)
#     ├── mind-api.uni-robot.cn  → 127.0.0.1:8090 → api container (Go, :8080)
#     ├── mind-web.uni-robot.cn  → 127.0.0.1:8091 → web container (nginx static)
#     └── mind-lite.uni-robot.cn → 127.0.0.1:8093 → lite-web container (静态)
#   (8092 is the marketing site, deployed separately by .deploy-local/deploy-site.sh)
#   db (postgres) is internal to the compose network — no published host port.
#
# Secrets come from deploy/.env.prod (git-ignored). Nothing secret lives here.
name: mindimprint

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mindimprint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mindimprint
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindimprint -d mindimprint"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Intentionally no `ports:` — only the api service reaches it, over the
    # compose network at host `db`. Keeps Postgres off the public interface and
    # avoids clashing with the host's own Postgres on 127.0.0.1:5432.

  api:
    build:
      context: ../apps/api
    image: mindimprint-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mindimprint:${POSTGRES_PASSWORD}@db:5432/mindimprint?sslmode=disable
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECURE: "true"
      PAI_API_KEY: ${PAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODEL_CHAT: ${MODEL_CHAT:-}
      MODEL_FAST_CHAT: ${MODEL_FAST_CHAT:-}
      MODEL_EVAL: ${MODEL_EVAL:-}
      VOICE_APP_ID: ${VOICE_APP_ID:-}
      VOICE_ACCESS_KEY: ${VOICE_ACCESS_KEY:-}
      VOICE_TTS_VOICE: ${VOICE_TTS_VOICE:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_CDN_DOMAIN: ${OSS_CDN_DOMAIN:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_ADMIN_KEY: ${OSS_ADMIN_KEY:-}
      OSS_CDN_AUTH_KEY: ${OSS_CDN_AUTH_KEY:-}
      OSS_CDN_AUTH_WINDOW: ${OSS_CDN_AUTH_WINDOW:-7200}
    ports:
      - "127.0.0.1:8090:8080"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        # Where a lite-edition student who signed in here gets sent. The
        # Dockerfile already defaults this to the production host, so a
        # missing entry in .env.prod degrades to the right value rather than
        # to an empty string.
        VITE_LITE_APP_URL: ${VITE_LITE_APP_URL:-https://mind-lite.uni-robot.cn}
    image: mindimprint-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:80"

  # The LITE edition's frontend. A separate bundle and a separate host, but the
  # same API and the same session: the cookie is host-only on mind-api and
  # same-site for every *.uni-robot.cn origin, so a student who signs in on
  # either frontend is signed in on both. Which one they belong in is decided
  # by schools.edition — see shell/edition/editionRouting.ts.
  lite-web:
    build:
      context: ..
      dockerfile: apps/lite-web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_PRO_APP_URL: ${VITE_PRO_APP_URL:-https://mind-web.uni-robot.cn}
    image: mindimprint-lite-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8093:80"

volumes:
  pgdata:
