<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>两条书籍来源链辨析</title>
<style>
html, body { font-size: 16px; }
button, input, select, textarea { font-size: 16px; }

:root{--ink:#1f2a2a;--muted:#61706d;--line:#d8e2df;--paper:#fbfaf6;--panel:#f3f8f6;--teal:#1b7f73;--good:#2b7a4b;--bad:#b54848;--gold:#a06a16}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;color:var(--ink);background:var(--paper)}
body{display:block}
.canvas{width:100%;height:100%;aspect-ratio:4/3;background:var(--paper);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
header{padding:8px 12px 7px;border-bottom:1px solid var(--line);background:#fff}
h1{margin:0;font-size:20px;line-height:1.2;letter-spacing:0}
.sub{margin:3px 0 0;color:var(--muted);font-size:16px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.7fr);gap:8px;padding:8px;min-height:0;overflow:hidden}
.zones,.cards{min-width:0;min-height:0;overflow:hidden}
.zones{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:7px}
.zone{background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px;display:grid;grid-template-rows:auto auto minmax(0,1fr);min-width:0;min-height:0;overflow:hidden}
.zone h2{margin:0 0 2px;font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zone p{margin:0 0 4px;font-size:16px;color:var(--muted);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop{border:1px dashed #b9c7c3;border-radius:6px;background:#f8fbfa;min-width:0;min-height:0;padding:4px;display:flex;align-content:flex-start;align-items:flex-start;gap:4px;flex-wrap:wrap;overflow:hidden}
.placement-chip{border:1px solid #9ebdb6;background:#eaf6f3;color:#185f56;border-radius:999px;padding:4px 7px;min-width:30px;font-size:16px;line-height:1;font-weight:700;cursor:pointer}
.placement-chip:hover{background:#d9eee9}
.cards{background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:5px}
.cards h2{display:none}
.pool{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:5px;min-width:0;min-height:0;overflow:hidden}
.card{border:1px solid #cbd7d4;background:#fff;border-radius:6px;padding:4px 5px;min-width:0;min-height:0;font-size:16px;line-height:1.08;cursor:grab;box-shadow:0 1px 0 rgba(20,40,36,.04);overflow:hidden;display:flex;align-items:flex-start;text-align:left;overflow-wrap:anywhere}
.drop .card{font-size:16px;line-height:1.08;padding:3px}
.card:focus{outline:3px solid rgba(27,127,115,.25)}
.card.selected{border-color:var(--teal);background:#eaf6f3}
.card.correct,.placement-chip.correct{border-color:var(--good);background:#edf8f1}
.card.wrong,.placement-chip.wrong{border-color:var(--bad);background:#fff0f0}
.zone.active{outline:3px solid rgba(27,127,115,.2)}
.controls{border-top:1px solid var(--line);padding:7px 8px;background:#fff;display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:7px;align-items:center}
.summary{width:100%;min-width:0;border:1px solid #cbd7d4;border-radius:6px;padding:8px;font-size:16px}
button{border:0;border-radius:6px;padding:8px 11px;font-weight:700;font-size:16px;cursor:pointer}
#check{background:#e9f0ee;color:#1f2a2a}
#finish{background:var(--teal);color:white}
#finish:disabled{background:#b8c8c4;cursor:not-allowed}
.status{font-size:16px;color:var(--muted);white-space:nowrap}
.feedback{font-size:16px;line-height:1.2;color:var(--muted);height:38px;overflow:hidden}
.feedback strong{color:var(--ink)}
@media(max-height:430px){header{padding:5px 9px 4px}h1{font-size:18px}.sub{display:none}main{padding:6px;gap:6px}.zones{gap:5px}.zone{padding:5px;grid-template-rows:auto minmax(0,1fr)}.zone p{display:none}.cards{padding:5px;gap:3px}.pool{gap:4px}.card{padding:4px;line-height:1.05}.feedback{height:22px;white-space:nowrap;text-overflow:ellipsis}.controls{padding:5px 6px;gap:5px}.summary{padding:6px}button{padding:6px 8px}}
@media(max-width:700px){header{padding:6px 8px 5px}h1{font-size:18px}.sub{display:none}main{gap:5px;padding:5px;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}.zones{gap:4px}.zone{padding:4px;grid-template-rows:auto minmax(0,1fr)}.zone p{display:none}.drop{gap:2px;padding:2px}.cards{padding:4px;gap:3px}.pool{grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}.card{padding:3px}.controls{padding:5px;gap:5px}.summary{padding:6px}button{padding:6px 8px}.feedback{height:34px}}

/* platform-course font verification repair */
.zone h2 { font-size: 16px !important; }
#summary { font-size: 16px !important; }
.summary { font-size: 16px !important; }
input { font-size: 16px !important; }
</style>
</head>
<body>
<section class="canvas">
<header>
  <h1>两条书籍来源链辨析</h1>
  <p class="sub">把每张卡放到最合适的位置。目标不是给 Anthropic 贴标签，而是分清：Project Panama、盗版电子书链、共同伦理争议，以及证据暂时不能推出的结论。</p>
</header>
<main>
  <section class="zones" aria-label="分类区">
    <div class="zone" data-zone="panama" tabindex="0"><h2>Project Panama</h2><p>购买纸质书、拆装订、扫描、处置原书。</p><div class="drop"></div></div>
    <div class="zone" data-zone="pirate" tabindex="0"><h2>盗版电子书链</h2><p>Books3、LibGen、PiLiMi 等来源的下载与保存。</p><div class="drop"></div></div>
    <div class="zone" data-zone="both" tabindex="0"><h2>两者都相关</h2><p>都涉及书籍如何进入模型训练资料，但风险边界不同。</p><div class="drop"></div></div>
    <div class="zone" data-zone="cannot" tabindex="0"><h2>目前不能推出</h2><p>证据不足，不能直接下结论。</p><div class="drop"></div></div>
  </section>
  <section class="cards">
    <h2>证据 / 判断卡</h2>
    <div id="pool" class="pool" aria-label="待分类卡片"></div>
    <div class="feedback" id="feedback">先点选或拖动一张卡，再点分类区。全部放完后点击“检查分类”。</div>
  </section>
</main>
<footer class="controls">
  <input id="summary" class="summary" aria-describedby="feedback" placeholder="总结至少 12 字，并包含至少 2 个关键词：Project Panama、盗版电子书、法律、伦理、区分">
  <button id="check" type="button">检查分类</button>
  <button id="finish" type="button" disabled>完成任务</button>
  <div class="status" id="status">0/12 已分类</div>
</footer>
</section>
<script>
const startedAt=Date.now();
const cards=[
  {id:"c1",text:"购买纸质书后扫描成数字文本",answer:"panama",key:true},
  {id:"c2",text:"拆掉书脊或破坏性扫描",answer:"panama",key:true},
  {id:"c3",text:"Books3、LibGen、PiLiMi",answer:"pirate",key:true},
  {id:"c4",text:"up to seven million copies",answer:"pirate",key:true},
  {id:"c5",text:"训练用途可能构成 fair use",answer:"both",key:false},
  {id:"c6",text:"盗版副本的下载与保存仍有版权风险",answer:"pirate",key:true},
  {id:"c7",text:"作者是否知情或获得补偿",answer:"both",key:false},
  {id:"c8",text:"公司公开透明度是否足够",answer:"both",key:false},
  {id:"c9",text:"Project Panama 一定违法",answer:"cannot",key:true},
  {id:"c10",text:"盗版电子书链与 Project Panama 完全相同",answer:"cannot",key:false},
  {id:"c11",text:"合法就一定没有伦理问题",answer:"cannot",key:false},
  {id:"c12",text:"透明度不足就证明劳动者被剥削",answer:"cannot",key:false}
];
const state={placements:{},selected:null,checked:false};
const pool=document.getElementById("pool");
const feedback=document.getElementById("feedback");
const statusEl=document.getElementById("status");
const finish=document.getElementById("finish");
const summary=document.getElementById("summary");
function cardEl(card){
  const el=document.createElement("button");
  el.type="button"; el.className="card"; el.draggable=true; el.dataset.id=card.id; el.textContent=`${card.id.replace("c","")}. ${card.text}`;
  el.addEventListener("click",()=>{state.selected=card.id; document.querySelectorAll(".card").forEach(c=>c.classList.toggle("selected",c.dataset.id===card.id)); feedback.textContent="已选择卡片，请点击一个分类区。";});
  el.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",card.id);});
  return el;
}
function render(){
  pool.innerHTML="";
  cards.forEach(c=>{ if(!state.placements[c.id]) pool.appendChild(cardEl(c)); });
  document.querySelectorAll(".drop").forEach(d=>d.innerHTML="");
  for(const [cid,z] of Object.entries(state.placements)){
    const c=cards.find(x=>x.id===cid);
    const chip=document.createElement("button");
    chip.type="button";
    chip.className="placement-chip";
    chip.textContent=cid.replace("c","");
    chip.title=`${c.text}（点击后可重新分类）`;
    chip.setAttribute("aria-label",`${c.text}，点击后可重新分类`);
    if(state.checked){ chip.classList.add(c.answer===z?"correct":"wrong"); }
    chip.addEventListener("click",event=>{
      event.stopPropagation();
      state.selected=cid;
      feedback.textContent=`已选择第 ${chip.textContent} 张卡，请点击新的分类区。`;
    });
    document.querySelector(`.zone[data-zone="${z}"] .drop`).appendChild(chip);
  }
  const placed=Object.keys(state.placements).length;
  statusEl.textContent=`${placed}/12 已分类`;
  updateFinish();
}
function place(cid,z){ state.placements[cid]=z; state.selected=null; state.checked=false; feedback.textContent="已放置。全部分类后点击“检查分类”。"; render(); }
document.querySelectorAll(".zone").forEach(zone=>{
  const z=zone.dataset.zone;
  zone.addEventListener("click",()=>{ if(state.selected) place(state.selected,z); });
  zone.addEventListener("dragover",e=>{e.preventDefault(); zone.classList.add("active");});
  zone.addEventListener("dragleave",()=>zone.classList.remove("active"));
  zone.addEventListener("drop",e=>{e.preventDefault(); zone.classList.remove("active"); const cid=e.dataTransfer.getData("text/plain"); if(cid) place(cid,z);});
});
document.getElementById("check").addEventListener("click",()=>{
  if(Object.keys(state.placements).length<cards.length){ feedback.innerHTML="<strong>还没完成分类。</strong> 请先把 12 张卡都放入分类区。"; return; }
  state.checked=true;
  const keyCards=cards.filter(c=>c.key);
  const keyCorrect=keyCards.filter(c=>state.placements[c.id]===c.answer).length;
  const totalCorrect=cards.filter(c=>state.placements[c.id]===c.answer).length;
  feedback.innerHTML=`<strong>关键卡 ${keyCorrect}/${keyCards.length} 正确，总计 ${totalCorrect}/12 正确。</strong> Project Panama 是纸书扫描链；盗版电子书链是版权责任风险更高的副本链。`;
  render();
  updateSummaryGuidance();
});
const summaryKeywords=["Project Panama","盗版电子书","法律","伦理","区分"];
summary.addEventListener("input",()=>{
  updateFinish();
  updateSummaryGuidance();
});
function summaryState(){
  const value=summary.value.trim();
  const matched=summaryKeywords.filter(keyword=>value.includes(keyword));
  return {value,length:value.length,matched,ok:value.length>=12&&matched.length>=2};
}
function summaryOk(){
  return summaryState().ok;
}
function updateSummaryGuidance(){
  if(!state.checked)return;
  const current=summaryState();
  if(current.ok){
    feedback.innerHTML="<strong>总结要求已满足。</strong> 现在可以点击“完成任务”。";
    feedback.title="总结要求已满足。现在可以点击完成任务。";
    statusEl.textContent="可以完成";
    return;
  }
  const missingLength=Math.max(0,12-current.length);
  const missingKeywords=Math.max(0,2-current.matched.length);
  const needs=[];
  if(missingLength)needs.push(`还需 ${missingLength} 个字`);
  if(missingKeywords)needs.push(`还需包含 ${missingKeywords} 个关键词`);
  const guidance=`分类正确，但总结尚未达标。${needs.join("；")}。可用关键词：${summaryKeywords.join("、")}。`;
  feedback.innerHTML=`<strong>分类正确，但总结尚未达标。</strong> ${needs.join("；")}。可用关键词：${summaryKeywords.join("、")}。`;
  feedback.title=guidance;
  statusEl.textContent=needs.join("，");
}
function updateFinish(){
  const all=Object.keys(state.placements).length===cards.length;
  const keyCorrect=cards.filter(c=>c.key).every(c=>state.placements[c.id]===c.answer);
  finish.disabled=!(state.checked && all && keyCorrect && summaryOk());
  finish.setAttribute("aria-disabled",String(finish.disabled));
}
const PROTOCOL="mind-course-interaction";
const VERSION="1.0";
let sessionToken=null;
const pendingFrameMessages=[];
let completionSent=false;

function postFrameMessage(type,payload){
  window.parent.postMessage({protocol:PROTOCOL,version:VERSION,sessionToken,type,payload},"*");
}
function send(type,payload){
  if(!sessionToken){pendingFrameMessages.push({type,payload});return;}
  postFrameMessage(type,payload);
}
window.addEventListener("message",event=>{
  const message=event.data;
  if(!message||message.protocol!==PROTOCOL||message.version!==VERSION||!message.sessionToken)return;
  const isNewSession=sessionToken!==message.sessionToken;
  sessionToken=message.sessionToken;
  if(!isNewSession)return;
  postFrameMessage("ready",{});
  while(pendingFrameMessages.length){
    const pending=pendingFrameMessages.shift();
    postFrameMessage(pending.type,pending.payload);
  }
});

finish.addEventListener("click",()=>{
  if(finish.disabled||completionSent) return;
  const totalCorrect=cards.filter(c=>state.placements[c.id]===c.answer).length;
  const duration=Math.round((Date.now()-startedAt)/1000);
  completionSent=true;
  send("completed",{
    resultId:"source-chain-sort-completed",
    correct:totalCorrect===cards.length,
    value:{
      placements:{...state.placements},
      summary:summary.value.trim(),
      totalCorrect,
      totalCards:cards.length,
      keyCardsCorrect:cards.filter(c=>c.key).every(c=>state.placements[c.id]===c.answer),
      duration
    }
  });
  feedback.innerHTML="<strong>已完成。</strong> 你的分类和总结已经提交。";
});
render();
</script>
</body>
</html>
