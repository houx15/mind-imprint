<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>暂缓转发提醒</title>
  <style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-size:16px;overflow-x:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6f8;color:#172333;padding:10px;display:grid;place-items:center}button,textarea{font:inherit;font-size:16px}.canvas{width:min(100%,760px);aspect-ratio:1/1;max-height:calc(100vh - 20px);background:#fff;border:1px solid #ccd7e1;border-radius:12px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;box-shadow:0 12px 28px rgba(20,45,70,.12)}header{padding:16px 18px;border-bottom:1px solid #dce4eb}h1{margin:0 0 5px;font-size:23px}p{margin:0;color:#536477;line-height:1.45}.form{padding:18px;display:grid;gap:15px;align-content:center;overflow:auto}label{display:grid;gap:6px;font-weight:700}.hint{font-size:16px;color:#65778b;font-weight:400}textarea{width:100%;min-height:105px;resize:vertical;border:1px solid #b9c8d6;border-radius:9px;padding:10px 12px;line-height:1.45}textarea:focus{outline:3px solid rgba(31,91,137,.15);border-color:#1f5b89}footer{border-top:1px solid #dce4eb;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.checks{display:grid;gap:4px}.ok{color:#177647}.bad{color:#9a3f2e}.tip{color:#65778b;font-weight:400}button{border:1px solid #1f5b89;border-radius:8px;background:#1f5b89;color:#fff;padding:9px 16px;font-weight:700}button:disabled{background:#e5ebf1;border-color:#cad5df;color:#8592a0}@media(max-width:620px){.canvas{aspect-ratio:auto;max-height:none}.form{align-content:start}}</style>
</head>
<body><main class="canvas" role="application" aria-label="暂缓转发提醒写作"><header><h1>把情绪反应变成核查提醒</h1><p>两栏都认真写下来就可以提交——用你自己的话，不必命中某个词。</p></header><section class="form"><label>1. 承认这张图带来的感受<span class="hint">可写同情、担忧、难过、震惊或转发冲动。</span><textarea id="feeling" maxlength="120" placeholder="例如：这张图让我很同情，也让我产生立即转发的冲动……"></textarea></label><label>2. 写出仍需核查的证据<span class="hint">可查原始发布者、原新闻、发布时间、反向搜图、EXIF 或完整上下文。</span><textarea id="evidence" maxlength="160" placeholder="例如：但我还要反向搜图，并回到原新闻核对发布者和时间……"></textarea></label></section><footer><div class="checks" id="checks" aria-live="polite"></div><button id="complete" disabled>完成任务</button></footer></main>
<script>const PROTOCOL='mind-course-interaction',VERSION='1.0';let sessionToken=null,completionSent=false;const pending=[],startedAt=Date.now(),feeling=document.getElementById('feeling'),evidence=document.getElementById('evidence'),checks=document.getElementById('checks'),complete=document.getElementById('complete');function post(type,payload){window.parent.postMessage({protocol:PROTOCOL,version:VERSION,sessionToken,type,payload},'*')}function send(type,payload){if(!sessionToken)pending.push({type,payload});else post(type,payload)}window.addEventListener('message',e=>{const m=e.data;if(!m||m.protocol!==PROTOCOL||m.version!==VERSION||!m.sessionToken)return;const fresh=sessionToken!==m.sessionToken;sessionToken=m.sessionToken;if(!fresh)return;post('ready',{});while(pending.length){const x=pending.shift();post(x.type,x.payload)}});function compact(v){return v.replace(/\s/g,'')}function written(v,min){const t=compact(v);return t.length>=min&&!/(.)\1{4,}/.test(t)}const emotionCue=/同情|担心|担忧|难过|震惊|触动|害怕|感动|心疼|难受|情绪|转发/,evidenceCue=/来源|原新闻|原始发布|发布者|反向搜图|Google\s*Images|时间|地点|EXIF|元数据|上下文|多家媒体|核查|查证|出处/;function state(){return{feeling:feeling.value.trim(),evidence:evidence.value.trim()}}
/* 门槛只看「有没有认真写」，不看有没有命中某些词。关键词只做提示，永远不阻断提交。*/
function gates(s){const f=compact(s.feeling).length,e=compact(s.evidence).length;return[['写下这张图带来的感受（至少 12 字，已写 '+f+' 字）',written(s.feeling,12)],['写下仍需核查的证据（至少 14 字，已写 '+e+' 字）',written(s.evidence,14)],['两栏写的不是同一句话',compact(s.feeling)!==compact(s.evidence)]]}function nudges(s){const out=[];if(written(s.feeling,12)&&!emotionCue.test(s.feeling))out.push('提示（不影响提交）：可以把情绪点名，例如同情、担忧、震惊或想转发的冲动。');if(written(s.evidence,14)&&!evidenceCue.test(s.evidence))out.push('提示（不影响提交）：可以写得更可执行，例如反向搜图、查原始发布者、核对发布时间或 EXIF。');return out}function render(){const s=state(),gs=gates(s);checks.innerHTML=gs.map(x=>'<span class="'+(x[1]?'ok':'bad')+'">'+(x[1]?'✓ ':'✗ ')+x[0]+'</span>').join('')+nudges(s).map(t=>'<span class="tip">'+t+'</span>').join('');complete.disabled=completionSent||gs.some(x=>!x[1])}[feeling,evidence].forEach(x=>x.addEventListener('input',render));complete.addEventListener('click',()=>{const s=state();if(completionSent||gates(s).some(x=>!x[1]))return;completionSent=true;send('completed',{resultId:'emotion-pause-'+startedAt,value:{acknowledgedFeeling:s.feeling,verificationNeed:s.evidence,namedAnEmotion:emotionCue.test(s.feeling),namedACheckableAction:evidenceCue.test(s.evidence),durationSeconds:Math.max(1,Math.round((Date.now()-startedAt)/1000))}});render()});render();</script></body></html>
