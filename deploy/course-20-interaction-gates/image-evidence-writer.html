<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片证据三联单</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-size: 16px; overflow-x: hidden; }
    body { background: #eef3f7; color: #172333; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; display: grid; place-items: center; padding: 10px; }
    button, textarea { font: inherit; font-size: 16px; }
    .canvas { width: min(100vw - 20px, 760px); aspect-ratio: 4 / 3; max-height: calc(100vh - 20px); background: #fff; border: 1px solid #ccd7e2; border-radius: 12px; box-shadow: 0 12px 30px rgba(25,42,64,.14); display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
    header { padding: 15px 18px 11px; border-bottom: 1px solid #dbe3eb; }
    h1 { margin: 0 0 6px; font-size: 21px; }
    p { margin: 0; color: #4d5d70; line-height: 1.45; }
    .form { min-height: 0; overflow: auto; padding: 12px 18px; display: grid; gap: 10px; }
    label { display: grid; gap: 5px; font-weight: 700; }
    label .auxiliary { font-weight: 400; color: #617185; font-size: 14px; }
    textarea { width: 100%; min-height: 62px; resize: vertical; border: 1px solid #b9c7d5; border-radius: 8px; padding: 9px 10px; line-height: 1.45; color: #172333; }
    textarea:focus { outline: 3px solid rgba(31,91,137,.16); border-color: #1f5b89; }
    footer { padding: 10px 18px; border-top: 1px solid #dbe3eb; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    #feedback { color: #536477; line-height: 1.35; }
    button { border: 1px solid #1f5b89; border-radius: 8px; background: #1f5b89; color: #fff; padding: 9px 16px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    button:disabled { background: #e5ebf1; border-color: #cbd5df; color: #8592a0; cursor: not-allowed; }
    @media (max-width: 620px) { .canvas { aspect-ratio: auto; max-height: none; } }
  </style>
</head>
<body>
  <main class="canvas" role="application" aria-label="图片证据三联单">
    <header>
      <h1>图片证据三联单</h1>
      <p>三项都写下来就可以提交——用你自己的话。内部线索写“看到了什么”，外部动作写“到哪里、查什么”。</p>
    </header>
    <section class="form">
      <label>内部视觉线索 1 <span class="auxiliary">例如：手指数量、牙齿形状、皮肤纹理、背景文字或局部光影。</span><textarea id="internal1" maxlength="120" placeholder="写出具体位置与异常，不要只写“图片很假”。"></textarea></label>
      <label>内部视觉线索 2 <span class="auxiliary">必须与第一条不同，并指出另一个可观察细节。</span><textarea id="internal2" maxlength="120" placeholder="可按 Enter 换行补充说明。"></textarea></label>
      <label>外部核查动作 <span class="auxiliary">例如：查 EXIF 字段、反向搜图、找原新闻或核对原始发布者。</span><textarea id="external" maxlength="140" placeholder="写清使用什么入口或工具，以及准备核对什么。"></textarea></label>
    </section>
    <footer><div id="feedback">还需完成两条不同的内部线索和一条外部核查动作。</div><button id="complete" disabled>完成任务</button></footer>
  </main>
  <script>
    const PROTOCOL = 'mind-course-interaction';
    const VERSION = '1.0';
    let sessionToken = null;
    const pending = [];
    let completionSent = false;
    const startedAt = Date.now();
    const fields = ['internal1', 'internal2', 'external'].map((id) => document.getElementById(id));
    const feedback = document.getElementById('feedback');
    const complete = document.getElementById('complete');
    // 只做提示，不做门槛：命中与否随 payload 一起记录，但从不阻断提交。
    const externalCues = /EXIF|\u5143\u6570\u636e|\u53cd\u5411\u641c\u56fe|Google|\u539f\u65b0\u95fb|\u539f\u59cb\u53d1\u5e03|\u53d1\u5e03\u8005|\u6765\u6e90|\u68c0\u6d4b\u5de5\u5177|\u539f\u7ad9|\u53d1\u5e03\u65f6\u95f4|\u62cd\u6444\u65f6\u95f4|\u5730\u70b9|GPS|\u641c|\u67e5\u8bc1|\u51fa\u5904/i;

    function post(type, payload) { window.parent.postMessage({ protocol: PROTOCOL, version: VERSION, sessionToken, type, payload }, '*'); }
    function send(type, payload) { if (!sessionToken) pending.push({ type, payload }); else post(type, payload); }
    window.addEventListener('message', (event) => {
      const message = event.data;
      if (!message || message.protocol !== PROTOCOL || message.version !== VERSION || !message.sessionToken) return;
      const changed = sessionToken !== message.sessionToken;
      sessionToken = message.sessionToken;
      if (!changed) return;
      post('ready', {});
      while (pending.length) { const item = pending.shift(); post(item.type, item.payload); }
    });

    function compact(text) { return text.replace(/\s/g, ''); }
    function written(text, min) {
      const t = compact(text);
      return t.length >= min && !/(.)\1{4,}/.test(t);
    }
    function state() {
      const [internal1, internal2, external] = fields.map((field) => field.value.trim());
      const different = compact(internal1) !== compact(internal2);
      return { internal1, internal2, external, different };
    }
    function issues(current) {
      const result = [];
      if (!written(current.internal1, 8)) result.push('内部线索 1 还需写够 8 字（已写 ' + compact(current.internal1).length + ' 字）');
      if (!written(current.internal2, 8)) result.push('内部线索 2 还需写够 8 字（已写 ' + compact(current.internal2).length + ' 字）');
      if (written(current.internal1, 8) && written(current.internal2, 8) && !current.different) result.push('两条内部线索不能相同');
      if (!written(current.external, 10)) result.push('外部动作还需写够 10 字（已写 ' + compact(current.external).length + ' 字）');
      return result;
    }
    function render() {
      const current = state();
      const currentIssues = issues(current);
      complete.disabled = completionSent || currentIssues.length > 0;
      if (currentIssues.length) { feedback.textContent = currentIssues.join('；'); return; }
      feedback.textContent = externalCues.test(current.external)
        ? '三项证据已完整，可以提交。'
        : '三项证据已完整，可以提交。提示（不影响提交）：外部动作可以点名入口或工具，例如反向搜图、查 EXIF、找原始发布者。';
    }
    fields.forEach((field) => field.addEventListener('input', render));
    complete.addEventListener('click', () => {
      const current = state();
      if (completionSent || issues(current).length > 0) return;
      completionSent = true;
      send('completed', {
        resultId: 'image-evidence-' + startedAt,
        value: {
          internalClue1: current.internal1,
          internalClue2: current.internal2,
          externalAction: current.external,
          namedAnExternalEntryPoint: externalCues.test(current.external),
          durationSeconds: Math.max(1, Math.round((Date.now() - startedAt) / 1000))
        }
      });
      render();
    });
    render();
  </script>
</body>
</html>
