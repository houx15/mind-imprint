# Lite-edition web stack — 思维印记 · lite reading/writing SPA
#
# DELIBERATELY SEPARATE from deploy/docker-compose.prod.yml and
# deploy/docker-compose.site.yml, mirroring the site stack's shape: a single
# static SPA behind nginx, no database, no secrets. Different compose project
# name and its own port, so bringing lite up or down cannot touch the pro SPA,
# the API or the marketing site.
#
# Lite talks to the SAME Go API as the pro SPA (apps/lite-web adds routes to
# the existing apps/api service; P1 stood up no separate backend) — so the
# default VITE_API_BASE_URL below matches apps/web's, not a distinct host.
# Override it only if a lite-specific API origin is ever introduced.
#
# Run from the repo root:
#   docker compose -f deploy/docker-compose.lite.yml up -d --build
#
# Topology (once a host vhost is added — not yet created, see the P1 task-13
# report for what's outstanding):
#   host nginx (TLS, certbot)
#     ├── mind-api.uni-robot.cn   → 127.0.0.1:8090  → api container       (existing, shared)
#     ├── mind-web.uni-robot.cn   → 127.0.0.1:8091  → web container       (existing, pro SPA)
#     ├── mind.uni-robot.cn       → 127.0.0.1:8092  → site container      (existing, marketing)
#     └── <lite domain, TBD —     → 127.0.0.1:8093  → lite-web container  (THIS FILE)
#          MUST be *.uni-robot.cn, see OPERATOR PREREQUISITE (2)>
#
# There are no secrets in this stack: VITE_API_BASE_URL is a public origin,
# baked into the bundle at build time, not a credential. So, like the site
# stack, this compose file takes no --env-file.
#
# OPERATOR PREREQUISITE — not yet done, and not fixable here (same reason the
# vhost above is still TBD: the lite domain isn't decided, and deploy/.env.prod
# is gitignored, out of this repo, on the API host, not this one):
# lite's auth depends on credentialed fetches (apps/lite-web/src/api/client.ts
# sends `credentials: "include"`) reaching the SAME api container the pro SPA
# uses. That container's CORS allowlist is CORS_ORIGINS, an EXACT-MATCH list
# (apps/api/internal/config/config.go, consumed by apps/api/internal/httpx/
# server.go; deploy/env.prod.example currently sets it to the pro domain
# only). Before lite goes live on its own domain, an operator MUST append the
# lite origin to CORS_ORIGINS in deploy/.env.prod and redeploy the api
# container — otherwise the browser blocks every credentialed request from
# lite (sign-in and everything session-dependent) with no server-side error to
# point at it.
#
# OPERATOR PREREQUISITE (2) — THE LITE DOMAIN MUST BE A SUBDOMAIN OF
# uni-robot.cn. This one constrains which domain may be chosen at all, so it
# has to be settled before the vhost above, not after.
#
# The session cookie the API sets is SameSite=Lax (apps/api/internal/api/cookie.go,
# same cookie the pro SPA uses). Lax means the browser withholds it from
# cross-SITE requests — and "site" is the registrable domain, NOT the origin.
# So:
#
#   lite.uni-robot.cn      → same site as mind-api.uni-robot.cn → cookie sent ✅
#   mind-lite.example.com  → a different site entirely          → cookie NEVER sent ❌
#
# On its own registrable domain, NO amount of CORS configuration can make
# sign-in work: CORS_ORIGINS governs whether the browser lets the RESPONSE
# through, while SameSite governs whether the cookie is attached to the
# REQUEST in the first place. Adding the origin to CORS_ORIGINS makes the
# preflight pass and the request still arrives unauthenticated.
#
# That is exactly what makes this worth writing down: the failure looks
# IDENTICAL to the CORS failure from the console — requests that fail only
# when credentialed — so an operator will reasonably spend the afternoon
# re-checking CORS_ORIGINS, which is already correct. If lite ever genuinely
# needs its own registrable domain, that is a backend change (SameSite=None;
# Secure, plus the CSRF posture that implies), not a deploy-time knob.
name: mindimprint-lite

services:
  lite-web:
    build:
      context: ..
      dockerfile: apps/lite-web/Dockerfile
      args:
        # The public origin of the Go API, baked into the bundle at build
        # time. Same backend as the pro SPA unless overridden.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://mind-api.uni-robot.cn}
    image: mindimprint-lite-web:latest
    restart: unless-stopped
    ports:
      # 8090/8091/8092 are already taken by api/web/site (see
      # deploy/docker-compose.prod.yml, deploy/docker-compose.site.yml) — 8093
      # is the next free port, matching the port the P1 plan (Task 13 brief)
      # named for local dev.
      - "127.0.0.1:8093:80"
