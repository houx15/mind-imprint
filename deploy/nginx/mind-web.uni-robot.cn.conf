# Host nginx: reverse proxy for the single role-routed SPA (student/teacher/
# admin are one bundle; the logged-in user's role decides what renders).
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled/.
# certbot --nginx adds the :443 server block + http→https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name mind-web.uni-robot.cn;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
