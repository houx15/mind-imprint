# Host nginx: reverse proxy for the Go API. Install to
# /etc/nginx/sites-available/ and symlink into sites-enabled/. certbot --nginx
# adds the :443 server block + the http→https redirect (see docs/deploy/tls.md).
#
# The API both streams SSE (chat/studio turns) and upgrades WebSocket (voice),
# so we disable proxy buffering and use a $connection_upgrade map that passes
# `upgrade` only when the client asked for it (empty otherwise, for SSE/keepalive).

map $http_upgrade $mind_api_conn_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name mind-api.uni-robot.cn;

    # Materials fetch / uploads headroom.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (voice) + SSE (turns): upgrade when asked, else keep-alive.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mind_api_conn_upgrade;

        # Stream responses immediately; don't buffer SSE.
        proxy_buffering off;
        proxy_cache off;

        # The inline flagship assessment can take ~90s–2min. Give it room so the
        # proxy never cuts a finish/assessment mid-flight.
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
