# Host nginx: reverse proxy for the marketing site (static Astro build).
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled/.
# certbot --nginx adds the :443 server block + the http→https redirect
# (see docs/deploy/site.md).
#
# Separate vhost, separate upstream, separate container from the product:
#   mind.uni-robot.cn      → 127.0.0.1:8092  (site — this file)
#   mind-web.uni-robot.cn  → 127.0.0.1:8091  (the student/teacher SPA)
#   mind-api.uni-robot.cn  → 127.0.0.1:8090  (the Go API)

server {
    listen 80;
    listen [::]:80;
    server_name mind.uni-robot.cn;

    # Static pages and images only — no uploads, no streaming.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
