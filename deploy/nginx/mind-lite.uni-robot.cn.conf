# Host nginx: reverse proxy for the LITE edition SPA.
#
# A separate host from mind-web deliberately, not a path under it: which
# edition a student belongs to is decided by their school, and each edition
# gets its own front door so a student can bookmark the one that is theirs.
# Both hosts share the API's session cookie (same site, uni-robot.cn), so
# signing in on either one signs you in on both.
#
# Install with:  sudo bash deploy/install-nginx-sites.sh mind-lite.uni-robot.cn
#
# TLS IS DECLARED HERE, unlike mind-api/mind-web whose :443 blocks were added
# to the INSTALLED file by certbot. This host uses an Aliyun-issued DV
# certificate instead, because Let's Encrypt could not validate it: its
# production check queries the domain from several vantage points worldwide,
# and the non-China ones time out against uni-robot.cn's hichina nameservers.
# (A staging dry run — single perspective — passed, which is how we know
# nginx, DNS and reachability here are all correct.) Nothing rewrites this
# file, so the TLS config belongs in the repo where it can be reviewed.
#
# ⚠️  THE CERTIFICATE DOES NOT AUTO-RENEW. It is a ~90-day Aliyun DV cert; see
# docs/2026-08-27-lite-edition-auth-and-deployment.md for the renewal steps.
# Expiry of the current one is recorded there.

server {
    listen 80;
    listen [::]:80;
    server_name mind-lite.uni-robot.cn;

    # The session cookie is Secure, so a student on plain HTTP could sign in
    # and silently fail to stay signed in. Send everything to TLS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # No `http2` parameter here, matching the certbot-managed hosts. Listen
    # options are per address:port and set by whichever server block nginx
    # reads first, so declaring them differently here only earns a "protocol
    # options redefined" warning without enabling anything.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mind-lite.uni-robot.cn;

    # Full chain (leaf + intermediate) — nginx serves whatever is in this
    # file, so a leaf-only cert here would break clients that lack the
    # intermediate cached.
    ssl_certificate     /etc/nginx/ssl/mind-lite.uni-robot.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/mind-lite.uni-robot.cn.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL_lite:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
