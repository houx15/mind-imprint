# Host nginx: reverse proxy for the LITE edition SPA.
#
# A separate host from mind-web deliberately, not a path under it: which
# edition a student belongs to is decided by their school, and each edition
# gets its own front door so a student can bookmark the one that is theirs.
# Both hosts share the API's session cookie (same site, uni-robot.cn), so
# signing in on either one signs you in on both.
#
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled/.
# certbot --nginx adds the :443 server block + http→https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name mind-lite.uni-robot.cn;

    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
