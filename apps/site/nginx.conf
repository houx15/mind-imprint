# In-container nginx: serve the statically rendered marketing site. The host
# nginx terminates TLS and reverse-proxies mind.uni-robot.cn here
# (127.0.0.1:8092). This server holds no secrets and calls no API — the site is
# pure HTML/CSS that links out to the app.
#
# NOTE: this is NOT an SPA. Astro emits a real directory per route
# (/product/index.html, /en/product/index.html, ...), so unknown paths must 404
# rather than fall back to the homepage — a catch-all would render the homepage
# under every mistyped URL and poison search indexing with duplicates.

# Cache policy keyed on the response type, because the request URI can't tell us:
# a page is requested as `/product`, not `/product/index.html`, so a `~* \.html$`
# location never matches it and the pages would ship with no Cache-Control at
# all — leaving clients on a stale build after a deploy.
map $sent_http_content_type $mind_site_cache {
    default        "public, max-age=3600";
    ~*text/html    "no-store";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Astro's content-hashed build output: safe to cache hard.
    location /_astro/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Author-managed media (screenshots, portraits, diagrams). Filenames are not
    # content-hashed, so cache for a day and let a redeploy roll it over rather
    # than pinning a stale image for a year.
    location /media/ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Pages. `$uri/index.html` resolves the extensionless directory routes Astro
    # emits (/product -> /product/index.html).
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control $mind_site_cache;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }
}
