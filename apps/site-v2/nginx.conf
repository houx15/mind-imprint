map $sent_http_content_type $site_v2_cache {
    default "public, max-age=3600";
    ~*text/html "no-store";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    location = /en { return 301 /; }
    location /en/ { rewrite ^/en/(.*)$ /$1 permanent; }
    # Preserve inbound links from the previous marketing site.
    location ~ ^/(?:algorithm(?:/(?:evaluation|multi-agent))?|evaluation|product/evaluation)/?$ { return 301 /product/assessment/; }
    location ~ ^/product/teacher/?$ { return 301 /schools/; }
    location ~ ^/editions/?$ { return 301 /research-studio/; }
    location ~ ^/zh/editions/?$ { return 301 /zh/research-studio/; }
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control $site_v2_cache;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }
}
