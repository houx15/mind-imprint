# In-container nginx: serve the static lite SPA bundle. Same shape as
# apps/web/nginx.conf — content-hashed assets cached hard, everything else
# falls back to index.html so client-side routing (apps/lite-web/src/routing.ts
# has no router library; it drives real paths like /readings/:id straight off
# the History API) survives a hard refresh or a shared deep link.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Content-hashed build assets: cache hard.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA entry: the lite shell routes on the client (阅读/写作 tabs, reading
    # deep links), so any unknown path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /r/:token is the parent report opened by a share link. She is a minor, so
    # the page is not indexable. nginx drops a parent block's add_header inside
    # a child block, and a try_files fallback as the LAST argument is an
    # internal redirect to `location = /index.html`, which would drop this
    # block's headers too. So index.html is served here as a non-last argument
    # (served in place), and the no-store from the index.html block is repeated.
    location /r/ {
        try_files /index.html =404;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store";
    }

    # index.html itself must never be cached, or clients pin a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
