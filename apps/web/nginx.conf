# In-container nginx: serve the static SPA bundle. The host nginx terminates TLS
# and reverse-proxies mind-web.uni-robot.cn here (127.0.0.1:8091). All API calls
# go directly from the browser to https://mind-api.uni-robot.cn (baked into the
# bundle), so this server serves static assets only.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Content-hashed build assets: cache hard.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA entry: the app routes on the client (query params / role), so any
    # unknown path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or clients pin a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
